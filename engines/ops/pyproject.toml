[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "katip-ops"
version = "0.1.0"
description = "Independent Katip operations engine"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.3.0", "openai>=3.37.0", "pydantic>=2.14.1",
  "httpx>=0.28.1", "PyYAML>=6.0.3", "slack-bolt>=1.30.0",
  "aiohttp>=3.14.3,<4",
  "APScheduler>=3.11.3", "mcp>=2.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.1", "ruff>=0.17.2", "mypy>=2.4.0", "types-PyYAML>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/katip_ops"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
cache_dir = ".mypy_cache"

[[tool.mypy.overrides]]
module = ["yaml", "apscheduler.*"]
ignore_missing_imports = true
