[project]
name = "openkatip"
version = "0.1.0"
description = "Toplantılara katılan, canlı çeviri yapan, not tutan ve konuşan asistan"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
# Sürüm aralıkları test edilen sürümlere göre; kesin sürümler ve hash'ler requirements.lock'ta
# (Docker imajı yalnızca oradan kurar). Güncellemek: scripts/lock.sh
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "starlette>=1.5.1,<2",  # FileResponse Range DoS ve Host başlığı açıkları eski sürümlerde
    "uvicorn[standard]>=0.53,<0.55",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14.2,<3",
    "websockets>=16,<18",
    "httpx>=0.28.1,<1",
    "PyJWT[crypto]>=2.15.1,<3",
    "jsonschema>=4.26,<5",
    "anthropic>=1.9,<2",
    "playwright>=1.63,<1.64",
    "sqlalchemy[asyncio]>=2.1.1,<2.2",
    "asyncpg>=0.31,<0.32",
    "aiosqlite>=0.22.1,<0.23",
    "structlog>=25.5,<27",
    "numpy>=2.3,<3",
    "normalizer-tr>=0.4,<0.5",  # Apache-2.0, TTS için Türkçe metin normalizasyonu
    "python-docx>=1.2,<2",
    "pypdf>=6.19,<7",
    "pypdfium2>=5.14,<6",
    "pyyaml>=6.0.2,<7",
    "onnxruntime>=1.28,<2",
    "kaldi-native-fbank>=1.22,<2",
    "cryptography>=46",  # ses izlerinin AES-256-GCM ile şifrelenmesi
    "tzdata>=2026.1",
    # Dolaylı bağımlılıklarda bilinen açıklar için alt sınırlar
    "h11>=0.16",  # CVE-2025-43859 (request smuggling)
    "anyio>=4.14.2",
    "lxml>=6.1.0",  # python-docx üzerinden; XXE düzeltmesi
    "protobuf>=6.33.5",  # onnxruntime üzerinden
    "idna>=3.15",
]

[project.optional-dependencies]
providers = ["anthropic[bedrock,vertex]>=1.9,<2"]
dev = ["pytest>=9", "pytest-asyncio>=1.3", "ruff>=0.16,<0.17", "mypy>=2.3,<3", "pip-audit>=2.10", "uv>=0.12"]

[project.scripts]
katip-bot = "katip.bot.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/katip"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["verhex-ops", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Toplanti platformlarinin DOM'u her an degisebilir; her adim "bulamazsan devam et"
# mantiginda yazildi, genis except bilincli bir tercih.
# DOM seçicileri tek satırda okunaklı; bölmek aramayı zorlaştırır.
"src/katip/bot/platforms/*.py" = ["BLE001", "S110", "S112", "E501"]
"tests/*.py" = ["ASYNC240"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
